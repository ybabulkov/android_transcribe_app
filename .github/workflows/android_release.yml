name: Build Android App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # The action installs "tools platform-tools" by default, but the legacy
    # "tools" package no longer exists in the SDK repository.
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108" "platforms;android-36"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # transcribe-cpp-sys compiles its C++ core (whisper.cpp/ggml) via CMake.
    # ubuntu-latest ships cmake/ninja, but install explicitly to be safe.
    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

    # Two APKs per release: "standard" bundles Canary 1B v2 (~1.1 GB);
    # the "fdroid" flavor is the same app without a model (import your own).
    - name: Build Release APKs
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
      run: |
        ./gradlew assembleStandardRelease assembleFdroidRelease

    - name: Extract Version Name
      id: extract_version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "Detected Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Rename Artifacts
      run: |
        cp app/build/outputs/apk/standard/release/app-standard-release.apk offline_voice_input_mod_v${{ env.VERSION_NAME }}.apk
        cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk offline_voice_input_mod_v${{ env.VERSION_NAME }}_no_model.apk

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk-v${{ env.VERSION_NAME }}
        path: offline_voice_input_mod_v${{ env.VERSION_NAME }}*.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: Offline Voice Input (Mod) v${{ env.VERSION_NAME }}
        # Update this file before tagging a release.
        body_path: .github/release-notes.md
        files: |
          offline_voice_input_mod_v${{ env.VERSION_NAME }}.apk
          offline_voice_input_mod_v${{ env.VERSION_NAME }}_no_model.apk
